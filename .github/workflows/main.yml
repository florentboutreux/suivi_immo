name: Veille immobilière
 
on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python chasseur_immo.py
      - name: Commit des résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Veille du $(date +%F)"
          git push
 
 
